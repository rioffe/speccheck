[project]
name = "speccheck"
dynamic = ["version"]
description = "Specification conformance checker: traceability graph, JUnit results, model-judged test strength"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
speccheck = "speccheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/speccheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/speccheck"]
# package data (§10): the C-10 prompt and the byte-identical self-check fixture, goldens included
artifacts = ["src/speccheck/judge_prompt.md", "src/speccheck/_selfcheck/**"]

[tool.hatch.build.targets.sdist]
include = ["src/speccheck", "tests", "fixtures", "tools", "SPEC.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/speccheck/_selfcheck", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# tests and tools quote spec text and fixture strings verbatim
"tests/**" = ["E501"]
"tools/**" = ["E501"]

[tool.uv]
package = true
